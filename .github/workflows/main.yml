name: CI

on:
  pull_request:
    branches: [dev]

jobs:
  ci:
    name: Type-check · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm lint

      - name: Test (coverage)
        run: pnpm test:coverage

  e2e:
    name: Extension E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds @block-lock/shared-types first (turbo ^build), then the
      # extension into services/extension/dist, which the specs load.
      - name: Build extension
        run: pnpm turbo build --filter=@block-lock/extension

      - name: Install Chromium
        run: pnpm --filter @block-lock/extension exec playwright install --with-deps chromium

      # The specs launch with headless: false + --headless=new (extensions
      # need the full browser); xvfb-run guards against anything still
      # wanting a display on the runner.
      - name: Run E2E
        working-directory: services/extension
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: services/extension/test-results/
          retention-days: 7
